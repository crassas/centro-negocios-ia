<!doctype html><html lang="pt-PT"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jarvis Local</title>
<style>body{margin:0;background:#f4f1ea;color:#233026;font:18px system-ui}main{max-width:640px;margin:auto;padding:32px 22px}h1{font-size:42px;margin:12px 0}p{line-height:1.5}button,input{font:inherit;border-radius:12px;padding:16px;border:1px solid #ccc}button{background:#244d37;color:white;cursor:pointer}button:disabled{opacity:.5}input{box-sizing:border-box;width:100%;background:white;margin:15px 0}#answer{padding:20px;background:white;border-radius:18px;white-space:pre-wrap;min-height:120px}.row{display:flex;gap:12px;flex-wrap:wrap}small{color:#61685d}</style>
<main><small>CENTRO DE NEGÓCIOS · LOCAL</small><h1>Fala com o Jarvis.</h1><p id="status" role="status">Carrega em Falar. Carrega outra vez para terminar.</p><div class="row"><button id="mic">Falar</button><button id="stop">Parar voz</button></div>
<input id="text" placeholder="Ou escreve o teu pedido…" aria-label="Pedido"><button id="send">Enviar</button><p id="answer" aria-live="polite">Experimenta: “Jarvis, diz-me o estado da estação.”</p><small>Voz e raciocínio locais. As gravações temporárias são apagadas após a transcrição.</small></main>
<script>
const key="__KEY__",status=document.querySelector("#status"),answer=document.querySelector("#answer"),mic=document.querySelector("#mic");
let recorder,stream,chunks=[],audio,objectUrl,busy=false,generation=0;
async function api(path,body,type="application/json"){const r=await fetch(path,{method:"POST",headers:{"X-Jarvis-Key":key,"Content-Type":type},body:type==="application/json"?JSON.stringify(body):body});if(!r.ok){const e=await r.json();throw Error(e.error||"Pedido falhou")}return r}
function stop(){generation++;if(audio){audio.pause();audio.src=""}if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null}status.textContent="Voz parada."}
async function result(r,id){const d=await r.json();if(id!==generation)return;answer.textContent=(d.text?"Ouvi: "+d.text+"\n\n":"")+d.reply;status.textContent="A preparar resposta por voz…";try{const wav=await (await api("/speak",{text:d.reply})).blob();if(id!==generation)return;if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(wav);audio=new Audio(objectUrl);await audio.play();status.textContent="Resposta local."}catch(e){status.textContent="Texto pronto. Voz: "+e.message}}
async function request(path,body,type){if(busy)return;stop();const id=generation;busy=true;mic.disabled=true;status.textContent="A tratar do pedido…";try{await result(await api(path,body,type),id)}catch(e){status.textContent=e.message}finally{busy=false;mic.disabled=false}}
mic.onclick=async()=>{if(recorder?.state==="recording"){recorder.stop();return}try{stop();stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());mic.textContent="Falar";request("/listen",new Blob(chunks,{type:recorder.mimeType}),recorder.mimeType)};recorder.start();mic.textContent="Terminar gravação";status.textContent="Microfone activo. Fala agora.";const take=recorder;setTimeout(()=>{if(take.state==="recording")take.stop()},30000)}catch(e){status.textContent="Microfone: "+e.message}};
document.querySelector("#stop").onclick=()=>{stop();if(recorder?.state==="recording"){recorder.onstop=()=>stream.getTracks().forEach(t=>t.stop());recorder.stop();mic.textContent="Falar"}};
document.querySelector("#send").onclick=()=>request("/jarvis",{text:document.querySelector("#text").value});
document.querySelector("#text").onkeydown=e=>{if(e.key==="Enter")document.querySelector("#send").click()};
</script></html>
