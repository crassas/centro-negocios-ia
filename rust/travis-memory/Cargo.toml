[package]
name = "travis-memory"
version = "0.1.0"
edition = "2021"
description = "Experimental, opt-in Rust scoring kernel for Travis memory"
publish = false

[lib]
name = "travis_memory"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
