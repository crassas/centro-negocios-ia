name: Validate Centro Core

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "operit-agent/**"
      - "travis-*.mjs"
      - "travis-*.css"
      - "scripts/**"
      - "index.html"
      - "sw.js"
      - "cloudflare-ai-worker/src/index.js"
      - ".github/workflows/validate-core.yml"
  pull_request:
    paths:
      - "operit-agent/**"
      - "travis-*.mjs"
      - "travis-*.css"
      - "scripts/**"
      - "index.html"
      - "sw.js"
      - ".github/workflows/validate-core.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Python syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            python3 -m py_compile "$file"
          done < <(find operit-agent -maxdepth 1 -type f -name '*.py' -print0)

      - name: Blender Michael Jackson 3D installer preflight
        shell: bash
        run: |
          python3 -m py_compile scripts/install-travis-mj3d.py
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('mj3d','scripts/install-travis-mj3d.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          source=Path('travis-3d.mjs').read_text()
          text,changed=m.patch(source)
          assert not changed and text==source, 'Already installed integration must be idempotent'
          assert 'TravisMJ_Licensed_Head' in Path('travis-michael-jackson-3d.mjs').read_text()
          print('PASS TRAVIS MJ3D INSTALLER PATCH')
          PY

      - name: Travis persisted graph and particle brain tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=operit-agent python3 operit-agent/travis_brain_graph_selftest.py
          node scripts/travis-particle-brain-selftest.mjs
          node scripts/travis-hud-selftest.mjs
          node scripts/travis-scene-selftest.mjs
          python3 operit-agent/travis_scene_selftest.py

      - name: Travis operational awareness regression
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/travis-awareness-home"
          mkdir -p "$HOME"
          PYTHONPATH=operit-agent python3 operit-agent/travis_awareness_selftest.py

      - name: Travis core self-test
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/travis-core-home"
          mkdir -p "$HOME"
          PYTHONPATH=operit-agent python3 operit-agent/travis_core_selftest.py

      - name: Jarvis local regression self-test
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/jarvis-selftest-home"
          mkdir -p "$HOME"
          PYTHONPATH=operit-agent python3 operit-agent/jarvis_selftest.py
          node scripts/travis-voice-selftest.mjs

      - name: Streaming voice and supervisor ownership
        run: |
          python3 operit-agent/travis_continuity_selftest.py
          node scripts/travis-continuity-selftest.mjs
          python3 operit-agent/travis_stream_selftest.py
          python3 operit-agent/station_control_selftest.py
          node scripts/travis-stream-selftest.mjs
          node scripts/travis-live-stt-selftest.mjs
          node scripts/travis-voice-input-selftest.mjs

      - name: Reflexion memory and evaluator self-tests
        run: |
          python3 operit-agent/travis_reflexion_selftest.py
          python3 operit-agent/travis_cognitive_selftest.py
          python3 operit-agent/travis_brain_selftest.py
          python3 operit-agent/travis_reflexion_eval_selftest.py

      - name: Executor policy self-test
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/centro-home"
          mkdir -p "$HOME"
          python3 operit-agent/policy_selftest.py

      - name: Resilience self-test
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/centro-home-resilience"
          mkdir -p "$HOME"
          python3 operit-agent/resilience_selftest.py

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            sh -n "$file"
          done < <(find operit-agent -maxdepth 1 -type f -name '*.sh' -print0)

      - name: Worker JavaScript syntax
        run: node --check cloudflare-ai-worker/src/index.js

      - name: Worker queue and approval regression tests
        run: node cloudflare-ai-worker/queue_selftest.mjs
