name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Verificar JavaScript
        run: |
          node --check app.js
          node scripts/travis-panel-selftest.mjs
          node --check travis-3d.mjs
          node scripts/travis-hud-selftest.mjs
          node scripts/travis-audio-sync-selftest.mjs
          node --check travis-vision.mjs
          node --check travis-audio-sync.mjs
          python3 -m py_compile operit-agent/centro_station.py
          python3 scripts/travis-client-sync-selftest.py
          node scripts/travis-vision-selftest.mjs
          node scripts/travis-scene-selftest.mjs
          python3 operit-agent/travis_scene_selftest.py
          node scripts/travis-projection-selftest.mjs
          node scripts/travis-presence-selftest.mjs
          node --check agent-room.js
          node scripts/agent-room-selftest.mjs
          node scripts/execution-poll-selftest.mjs
          node --check scripts/monitor.mjs
          node -e "JSON.parse(require('fs').readFileSync('data/sites.json','utf8')); JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'));"

      - name: Verify continuous particle transformations
        run: |
          npm install --prefix "$RUNNER_TEMP/travis-three-test" --ignore-scripts --no-audit --no-fund three@0.180.0
          node scripts/travis-morph-continuity-selftest.mjs "$RUNNER_TEMP/travis-three-test/node_modules/three/build/three.module.js"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
