name: Verificar ligação Neon / Centro
on:
  pull_request:
    paths:
      - "business-neon.js"
      - "app.js"
      - "index.html"
      - "styles.css"
      - "cloudflare-ai-worker/**"
      - ".github/workflows/validate-business-neon.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar JavaScript
        run: |
          node --check business-neon.js
          node --check app.js
          node --check cloudflare-ai-worker/src/index.js
          node --check cloudflare-ai-worker/src/business-neon.js
      - name: Instalar dependências Worker
        run: npm install --prefix cloudflare-ai-worker --no-audit --no-fund
      - name: Executar testes Neon, sem credenciais
        run: npm test --prefix cloudflare-ai-worker
      - name: Garantir compatibilidade com fila de agentes
        run: node cloudflare-ai-worker/queue_selftest.mjs
