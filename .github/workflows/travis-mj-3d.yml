name: Build Travis Michael Jackson 3D

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_travis_mj_bust.py"
      - "scripts/render_travis_mj3d_preview.py"
      - ".github/workflows/travis-mj-3d.yml"

permissions:
  contents: write

concurrency:
  group: travis-mj3d-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Checkout Travis source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Blender headless
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy
          blender -b --python-expr "import sys; print('TRAVIS_BLENDER_PYTHON',sys.version); print('TRAVIS_BLENDER_PATHS',sys.path)"
          blender --version
      - name: Inspect licensed Michael Jackson 3D reference (CC BY 3.0 FR)
        run: |
          set -euo pipefail
          curl -fLSs --retry 3 --max-time 90 \
            https://www.free-3d.fr/assets/3d/7c4d7e298625ee53d36f155dfe157277/7c4d7e298625ee53d36f155dfe157277.glb \
            -o /tmp/travis-mj-licensed.glb
          test "$(stat -c%s /tmp/travis-mj-licensed.glb)" -gt 1000000
          blender -b -t 2 --python scripts/inspect_mj_licensed.py -- /tmp/travis-mj-licensed.glb | grep -F MJ_LICENSED_GLTF_DIAGNOSTICS
      - name: Independently preview CC BY licensed Michael Jackson 3D source
        run: |
          set -euo pipefail
          blender -b /tmp/travis-mj-licensed-preview.blend -t 2 \
            --python scripts/render_travis_mj3d_preview.py -- /tmp/travis-mj-reference
          cp /tmp/travis-mj-reference/travis-mj3d-preview-front.png \
            assets/travis/travis-mj3d-licensed-source-front.png
          cp /tmp/travis-mj-reference/travis-mj3d-preview-three-quarter.png \
            assets/travis/travis-mj3d-licensed-source-three-quarter.png
      - name: Create genuine 3D sculpt from original Travis CC0 bust
        run: |
          set -euo pipefail
          blender -b -t 2 --python scripts/build_travis_mj_bust.py -- \
            assets/travis/travis-face-bust.glb \
            assets/travis/travis-michael-jackson-3d.glb | tee /tmp/travis-mj-build.log
          grep -F "TRAVIS_MJ3D_BUILD_OK" /tmp/travis-mj-build.log
      - name: Inspect GLB header and required facial mesh anchors
        run: |
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          p=Path("assets/travis/travis-michael-jackson-3d.glb")
          b=p.read_bytes()
          assert b[:4]==b'glTF' and struct.unpack_from("<I",b,8)[0]==len(b)
          size,ctype=struct.unpack_from("<II",b,12)
          assert ctype==0x4e4f534a
          j=json.loads(b[20:20+size].decode())
          names={x.get('name') for x in j.get('nodes',[])}
          must={'TravisFace_Bust','TravisMJ_HairBase','TravisMJ_Curls'}
          must.update('TravisFace_'+part+'_'+side for part in ('Eye','Iris','Pupil') for side in ('L','R'))
          assert not(must-names), 'Missing mesh nodes: '+str(must-names)
          assert len(b)<12_000_000, 'GLB too heavy for Android'
          print('TRAVIS_MJ3D_GLB_VALID',len(b),sorted(must))
          PY
      - name: Render genuine 3D front and oblique QC frames (Cycles CPU)
        run: |
          set -euo pipefail
          blender -b assets/travis/travis-michael-jackson-3d.blend -t 2 --python \
            scripts/render_travis_mj3d_preview.py -- assets/travis | tee /tmp/travis-mj-preview.log
          grep -F 'TRAVIS_MJ3D_PREVIEW_OK' /tmp/travis-mj-preview.log
          test -s assets/travis/travis-mj3d-preview-front.png
          test -s assets/travis/travis-mj3d-preview-three-quarter.png
      - name: Commit built GLB asset for standalone offline installation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test -s assets/travis/travis-michael-jackson-3d.blend
          git add assets/travis/travis-michael-jackson-3d.glb assets/travis/travis-michael-jackson-3d.blend \
            assets/travis/travis-mj3d-preview-front.png \
            assets/travis/travis-mj3d-preview-three-quarter.png \
            assets/travis/travis-mj3d-licensed-source-front.png \
            assets/travis/travis-mj3d-licensed-source-three-quarter.png
          if git diff --cached --quiet; then
            echo 'TRAVIS_MJ3D_ASSET_UNCHANGED=true'
          else
            git commit -m 'assets(travis): generated MJ3D bust in Blender'
            pushed=false
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then pushed=true; break; fi
              sleep 3
            done
            if [ "$pushed" != true ]; then
              echo 'Cannot push generated asset after five fast-forward retries' >&2
              exit 1
            fi
          fi
