name: Travis native Rust checks
on:
  pull_request:
    paths:
      - "operit-agent/travis-rust/**"
      - "operit-agent/travis_rust_bridge.py"
      - "operit-agent/travis_rust_bridge_selftest.py"
      - "operit-agent/travis_rust_integration_selftest.py"
      - "operit-agent/travis_brain.py"
      - ".github/workflows/travis-rust.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust kernel
        run: cargo test --manifest-path operit-agent/travis-rust/Cargo.toml --all-targets
      - name: Build native executable
        run: cargo build --manifest-path operit-agent/travis-rust/Cargo.toml
      - name: Test Python compatibility and fallback
        run: python3 operit-agent/travis_rust_bridge_selftest.py
      - name: Test real Python SQLite against compiled Rust
        env:
          TRAVIS_RUST_BIN: ${{ github.workspace }}/operit-agent/travis-rust/target/debug/travis-core
        run: python3 operit-agent/travis_rust_integration_selftest.py
