name: Auditoria dos sites

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: ["main"]
    paths:
      - "data/sites.json"
      - "scripts/monitor.mjs"
      - ".github/workflows/monitor.yml"

permissions:
  contents: write

concurrency:
  group: "site-audit"
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Executar auditoria
        run: node scripts/monitor.mjs
      - name: Guardar leitura
        run: |
          if git diff --quiet -- data/live.json; then
            echo "Snapshot sem diferenças."
          else
            git config user.name "centro-negocios-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/live.json
            git commit -m "Atualizar auditoria dos sites"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
