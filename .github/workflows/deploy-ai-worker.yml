name: Deploy Cloudflare AI Worker

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "cloudflare-ai-worker/**"
      - ".github/workflows/deploy-ai-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Verificar credenciais Cloudflare
        id: cloudflare
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Credenciais Cloudflare disponíveis."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare ainda não está ligada a este repositório."
          fi

      - name: Checkout
        if: steps.cloudflare.outputs.ready == 'true'
        uses: actions/checkout@v6

      - name: Setup Node
        if: steps.cloudflare.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Deploy Worker
        if: steps.cloudflare.outputs.ready == 'true'
        working-directory: cloudflare-ai-worker
        run: npx --yes wrangler@latest deploy

      - name: Sincronizar Telegram
        if: steps.cloudflare.outputs.ready == 'true'
        working-directory: cloudflare-ai-worker
        shell: bash
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            node -e "require('fs').writeFileSync('/tmp/telegram-secrets.json', JSON.stringify({TELEGRAM_BOT_TOKEN:process.env.TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID:process.env.TELEGRAM_CHAT_ID}))"
            npx --yes wrangler@latest secret bulk /tmp/telegram-secrets.json
            rm -f /tmp/telegram-secrets.json
            echo "Telegram sincronizado a partir dos GitHub secrets."
          else
            echo "Mantidas as credenciais Telegram já guardadas no Worker."
          fi

      - name: Configurar webhook Telegram
        if: steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            WEBHOOK_URL="https://centro-negocios-ai.travisthejarvis.workers.dev/telegram/webhook"
            WEBHOOK_SECRET="$(printf '%s' "$TELEGRAM_BOT_TOKEN" | sha256sum | awk '{print $1}')"

            curl --fail --silent --show-error               -X POST               --data-urlencode "url=$WEBHOOK_URL"               --data-urlencode "secret_token=$WEBHOOK_SECRET"               --data-urlencode 'allowed_updates=["message","callback_query"]'               --data-urlencode "drop_pending_updates=false"               "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/setWebhook"               -o /tmp/telegram-webhook.json

            node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/telegram-webhook.json','utf8'));console.log(JSON.stringify({ok:x.ok,result:x.result,description:x.description||null},null,2));if(!x.ok||x.result!==true)process.exit(1);"

            sleep 1
            curl --fail --silent --show-error               "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/getWebhookInfo"               -o /tmp/webhook-after-set.json

            node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/webhook-after-set.json','utf8'));const r=x.result||{};console.log(JSON.stringify({url:r.url,pending_update_count:r.pending_update_count,last_error_message:r.last_error_message||null},null,2));if(r.url!=='$WEBHOOK_URL')process.exit(1);"
            echo "Telegram webhook confirmado: $WEBHOOK_URL"
          else
            echo "Sem TELEGRAM_BOT_TOKEN; webhook não configurado."
          fi

      - name: Diagnosticar webhook Telegram
        if: steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            curl --fail --silent --show-error               "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/getWebhookInfo"               -o /tmp/webhook-info.json
            node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/webhook-info.json','utf8'));const r=x.result||{};console.log(JSON.stringify({ok:x.ok,url:r.url,pending_update_count:r.pending_update_count,last_error_message:r.last_error_message||null,last_error_date:r.last_error_date||null,max_connections:r.max_connections||null,allowed_updates:r.allowed_updates||null},null,2));"
          fi

      - name: Testar Worker e Workers AI
        if: steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          sleep 2
          curl --fail --silent --show-error "https://centro-negocios-ai.travisthejarvis.workers.dev/health"
          echo
          curl --fail --silent --show-error \
            -X POST \
            -H "content-type: application/json" \
            --data '{"question":"Responde apenas em português de Portugal: IA operacional.","context":{"projects":[],"leads":[],"finance":{"income":0,"expense":0,"balance":0,"movements":0},"searchConsole":null}}' \
            "https://centro-negocios-ai.travisthejarvis.workers.dev/api/assist" \
            -o /tmp/ai-smoke.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/ai-smoke.json','utf8'));if(!x.ok||!x.answer)process.exit(1);console.log('Workers AI respondeu:',x.answer.slice(0,200));"
          curl --fail --silent --show-error \
            -X POST \
            -H "content-type: application/json" \
            --data '{"question":"Analisa o projecto e propõe uma próxima acção.","context":{"projects":[{"id":"teste","name":"Projecto Teste","crm":{"stage":"Activo","note":"Confirmar morada"}}],"leads":[],"finance":{"income":0,"expense":0,"balance":0,"movements":0},"searchConsole":null,"opportunities":[],"pendingDecisions":[]}}' \
            "https://centro-negocios-ai.travisthejarvis.workers.dev/api/agent" \
            -o /tmp/agent-smoke.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/agent-smoke.json','utf8'));if(!x.ok||!Array.isArray(x.actions))process.exit(1);console.log('Agent OK:',x.summary,'actions=',x.actions.length);"
          curl --fail --silent --show-error             -X POST             -H "content-type: application/json"             --data '{"text":"Centro de Negócios ligado ao @furalife_bot. Telegram operacional."}'             "https://centro-negocios-ai.travisthejarvis.workers.dev/api/telegram/notify"             -o /tmp/telegram-smoke.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/telegram-smoke.json','utf8'));if(!x.ok||!x.configured)process.exit(1);console.log('Telegram OK')"

      - name: Ligação pendente
        if: steps.cloudflare.outputs.ready != 'true'
        run: |
          echo "Para activar a IA, adicionar CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID aos Actions secrets deste repositório."
