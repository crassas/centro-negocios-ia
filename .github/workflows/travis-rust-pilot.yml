name: Travis Rust Pilot

on:
  push:
    branches: ["rust/travis-memory-pilot"]
    paths:
      - "rust/travis-memory/**"
      - "operit-agent/travis_rust_memory*.py"
      - "operit-agent/travis_github_feed*.py"
      - "docs/TRAVIS_GITHUB_FEED.md"
      - "docs/TRAVIS_RUST_TRANSITION.md"
      - ".github/workflows/travis-rust-pilot.yml"
  pull_request:
    paths:
      - "rust/travis-memory/**"
      - "operit-agent/travis_rust_memory*.py"
      - "operit-agent/travis_github_feed*.py"
      - "docs/TRAVIS_GITHUB_FEED.md"
      - "docs/TRAVIS_RUST_TRANSITION.md"
      - ".github/workflows/travis-rust-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-memory-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustc --version && cargo --version && python3 --version
      - name: Rust tests
        run: cargo test --manifest-path rust/travis-memory/Cargo.toml
      - name: Build optimised native library
        run: cargo build --release --manifest-path rust/travis-memory/Cargo.toml
      - name: Python/Rust parity and bounds
        env:
          PYTHONPATH: operit-agent
          TRAVIS_RUST_MEMORY_LIB: ./rust/travis-memory/target/release/libtravis_memory.so
        run: python3 operit-agent/travis_rust_memory_selftest.py -v
      - name: Synthetic microbenchmark (informational only)
        env:
          PYTHONPATH: operit-agent
          TRAVIS_RUST_MEMORY_LIB: ./rust/travis-memory/target/release/libtravis_memory.so
        run: python3 operit-agent/travis_rust_memory_benchmark.py --records 500 --repeats 40

      - name: GitHub knowledge feed (offline tests)
        env:
          PYTHONPATH: operit-agent
        run: python3 operit-agent/travis_github_feed_selftest.py -v
